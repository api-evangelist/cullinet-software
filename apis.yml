name: Cullinet Software
description: Cullinet Software (formerly Cullinane Database Systems) was a database and application
  software company based in Westwood, Massachusetts, best known for the IDMS/IDMS-DB mainframe database
  management system, the IDD data dictionary, and the ADS/Online application development environment
  for IBM mainframes. Backed by Battery Ventures, Greylock, and Morgenthaler Ventures, it was one of the
  first software companies to go public (1978) and was acquired by Computer Associates (CA) on June 30,
  1989. The company is defunct and publishes no developer portal, API, or documentation surface today;
  this record is retained as a historical portfolio-graph node with no enrichable API artifacts.
